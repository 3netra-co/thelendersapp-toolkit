name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  web-applications:
    name: Web applications
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/installer-portal/package-lock.json
            apps/workspace/package-lock.json
      - name: Build installer portal
        working-directory: apps/installer-portal
        run: npm ci && npm run build
      - name: Check and build customer workspace
        working-directory: apps/workspace
        run: npm ci && npm run typecheck && npm run build

  workspace-api:
    name: Workspace API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: services/workspace-api
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  azure-infrastructure:
    name: Azure infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Compile Bicep templates
        run: |
          az bicep build --file infra/azure/platform/main.bicep --stdout > /dev/null
          az bicep build --file infra/azure/customer/workspace-api.bicep --stdout > /dev/null
