name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  crm-web:
    name: CRM web
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/crm/web/package-lock.json
      - name: Check and build CRM web
        working-directory: apps/crm/web
        run: npm ci && npm run typecheck && npm run build

  crm-api:
    name: CRM API
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/crm/api/requirements.txt
      - name: Install CRM API dependencies
        working-directory: apps/crm/api
        run: python -m pip install --requirement requirements.txt
      - name: Run unit tests
        working-directory: apps/crm/api
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  azure-infrastructure:
    name: Azure infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile Bicep templates
        run: az bicep build --file apps/crm/infra/main.bicep --stdout > /dev/null
      - name: Verify customer-owned identity boundary
        run: |
          if jq -e '.parameters | has("entraTenantId") or has("entraClientId")' apps/crm/infra/azuredeploy.json > /dev/null; then
            echo "The base CRM deployment must not accept Toolkit or customer Entra identifiers."
            exit 1
          fi
          if rg -F "ab8cf08b-020d-4f6e-b1cb-d6a66e3a6c1c" apps/crm; then
            echo "The public CRM must not contain the private Toolkit installer client ID."
            exit 1
          fi
