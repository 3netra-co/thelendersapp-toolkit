openapi: 3.1.0
info:
  title: The Lenders App Core API
  version: 0.2.1
  description: Customer-owned organization, identity, lead, event, and workflow boundary.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200": { description: Runtime is available }
  /config:
    get:
      operationId: getPublicConfiguration
      security: []
      responses:
        "200": { description: Customer Entra SPA configuration }
  /session:
    get:
      operationId: getSession
      responses:
        "200": { description: Active organization membership }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /leads:
    get:
      operationId: listLeads
      responses:
        "200": { description: Stored lead projections for the active organization }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createLead
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLead" }
      responses:
        "202":
          description: Lead accepted and workflow event emitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcceptedLead" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /leads/import:
    post:
      operationId: importLeads
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [records]
              properties:
                defaultSource: { type: string, default: import }
                records:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: "#/components/schemas/CreateLead" }
      responses:
        "202": { description: Every record was accepted through the lead command pipeline }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
security:
  - entraBearer: [CRM.Access]
components:
  securitySchemes:
    entraBearer:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/authorize
          tokenUrl: https://login.microsoftonline.com/{tenantId}/oauth2/v2.0/token
          scopes: { CRM.Access: Access the customer-owned application }
  schemas:
    CreateLead:
      type: object
      properties:
        firstName: { type: string, maxLength: 100 }
        lastName: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 40 }
        source: { type: string, maxLength: 100, default: manual }
        requestedLoanAmount: { type: number, minimum: 0 }
      anyOf:
        - required: [firstName]
        - required: [lastName]
        - required: [email]
        - required: [phone]
    AcceptedLead:
      type: object
      required: [leadId, eventId, status]
      properties:
        leadId: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        status: { const: accepted }
    Problem:
      type: object
      required: [error]
      properties: { error: { type: string } }
  responses:
    BadRequest:
      description: Invalid command
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Unauthorized:
      description: Microsoft token is absent or invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
    Forbidden:
      description: Organization membership or role does not allow the action
      content: { application/json: { schema: { $ref: "#/components/schemas/Problem" } } }
